name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check fieldhorizon tests

      - name: mypy
        run: mypy fieldhorizon tests

      - name: pytest
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install contract toolchain
        run: npm ci
        working-directory: contract

      - name: Regenerate TypeScript contract types
        run: npm run generate
        working-directory: contract

      - name: Fail if generated types.gen.ts drifted from the committed file
        run: git diff --exit-code -- contract/types.gen.ts
