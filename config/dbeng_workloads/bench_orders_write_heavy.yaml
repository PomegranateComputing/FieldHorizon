# Write-dominated workload for the regression scenario.
# A rare exact lookup by `note` (an md5 string) makes an index on note look attractive to the
# advisor; but the workload is dominated by batch inserts, and every insert now has to maintain
# a b-tree over random 32-character keys. The deterministic acceptance must catch that and revert.
# v2 (DB-02): adds a control query; the measured queries are unchanged from v1.
workload_version: 2
name: bench_orders_write_heavy

queries:
  - id: order_by_note
    kind: read
    weight: 1
    sql: SELECT id, status FROM bench.orders WHERE note = md5(%(n)s::text)
    params:
      n: {int_range: [1, 2000000], count: 6, seed: 23}

  - id: order_insert_batch
    kind: write
    weight: 400
    repeat: 8
    sql: >-
      INSERT INTO bench.orders (customer_id, status, amount, created_at, note)
      SELECT 1 + (g %% 200000), 'new', 10.00, now(), md5(random()::text) FROM generate_series(1, 4000) g

  - id: orders_status_summary
    kind: read
    weight: 1
    repeat: 3
    sql: SELECT status, count(*), sum(amount) FROM bench.orders GROUP BY status

  # Control (DB-02): served by the customers primary key, so no candidate on bench.orders can help
  # or hurt it, and control queries are never diagnosed for candidates. If its timing moves between
  # baseline and after, the environment moved (policy measurement.max_control_drift). Weight 0: it
  # does not count in the weighted workload.
  - id: control_customers_pk_range
    kind: read
    weight: 0
    control: true
    repeat: 4
    sql: SELECT count(*), max(region) FROM bench.customers WHERE id BETWEEN %(lo)s AND %(lo)s + 50000
    params:
      lo: {int_range: [1, 150000], count: 2, seed: 41}
