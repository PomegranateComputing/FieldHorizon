# Field Horizon ontology (review §4): the single declarative source of
# truth for domain-biased retrieval routing, evaluator keyword scoring,
# rewrite directives, and the ontological pressure graph's opposition
# pairs. Python (fieldhorizon.ontology_spec) and Rust (fh-core) both load
# this file so the two pressure engines can never disagree.
#
# Each domain block may populate any subset of:
#   hints             - query terms that indicate this domain (retrieval routing)
#   expansions        - extra terms to widen a query once this domain is detected
#   sources           - preferred source_types to search when this domain is detected
#   keywords          - terms whose presence in a fragment counts as "developing"
#                        an axiom of this category (evaluator enforcement scoring)
#   rewrite_directive - instruction telling the rewriter what concepts to develop
#                        when an axiom of this category (or one of its hints) is
#                        among the retrieved axioms
#
# A domain does not need every field. The six culture_war sub-categories
# below (elite_capture, censorship, ...) exist only as JSON-corpus category
# values scored by the evaluator; they have no hints/expansions/sources of
# their own because retrieval only ever routes on the culture_war umbrella.

domains:
  culture_war:
    hints:
      - culture_war
      - culture
      - war
      - elite_capture
      - elite
      - elites
      - censorship
      - meritocracy
      - secular_religion
      - institutional_decay
      - technology_power
    expansions:
      - elite
      - elites
      - censorship
      - meritocracy
      - institution
      - decay
      - modernity
      - power
      - speech
      - memory
      - obedience
    sources: [manifesto, red_flags, sacred_quran, sacred_bible]
    keywords: []
    rewrite_directive: >-
      explicitly develop elite capture, censorship, meritocracy, secular
      religion, institutional decay, and technology power

  tawhid:
    hints:
      - tawhid
      - unity
      - one
      - idolatry
      - idol
      - idols
      - shirk
      - allah
      - transcendence
      - multiplicity
    expansions: [allah, one, unity, god, idol, idols, shirk, worship, lord]
    sources: [sacred_quran, red_flags, sacred_bible]
    keywords: [tawhid, unity, idol, idolatry, allah, one]
    rewrite_directive: >-
      explicitly develop unity, idolatry, Allah, worship, false mediation,
      and transcendence

  logos:
    hints: [logos, word, language, truth, incarnation, meaning, civilization, speech]
    expansions: [word, logos, language, truth, meaning, light, incarnation]
    sources: [sacred_bible, red_flags, sacred_quran]
    keywords: [logos, word, language, truth, incarnation]
    rewrite_directive: >-
      explicitly develop word, meaning, truth, language, revelation, and
      incarnation

  apocalypse:
    hints:
      - apocalypse
      - judgment
      - collapse
      - stars
      - mountains
      - destroyed
      - day
      - end
      - unveiling
      - trumpet
      - fire
      - heaven
      - earthquake
    expansions:
      - judgment
      - day
      - stars
      - mountains
      - fire
      - destroyed
      - collapse
      - heaven
      - earth
      - unveiling
      - trumpet
    sources: [sacred_quran, red_flags, sacred_bible]
    keywords: [apocalypse, judgment, unveiling, collapse, trumpet]
    rewrite_directive: >-
