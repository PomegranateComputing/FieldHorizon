# Each entry: [category_a, category_b, reason]. Order does not matter --
# lookups check both (a, b) and (b, a). Category names here are JSON-corpus
# `category` values; they don't need a matching domains: block above (e.g.
# multiplicity/incompleteness/closed_system_failure/consistency/
# self_reference/undecidable_truth/axiom_hunger exist only as opposition
# partners, mostly from the Gödel-engine corpus).
oppositions:
  - [tawhid, multiplicity, "unity versus fragmentation"]
  - [logos, bureaucracy, "meaning versus administration"]
  - [logos, modernity, "meaning versus procedural modernity"]
  - [apocalypse, modernity, "unveiling versus concealment"]
  - [incompleteness, closed_system_failure, "formal limit inside closed doctrine"]
  - [consistency, self_reference, "self-reference destabilizes consistency"]
  - [undecidable_truth, bureaucracy, "truth beyond procedure"]
  - [axiom_hunger, closed_system_failure, "failed closure demands new axiom"]
  - [technology_power, tawhid, "machine mediation versus divine unity"]
  - [censorship, logos, "speech control versus revealed meaning"]

# Doctrinal weather axes (Civilization Engine observability phase):
# read-only analytics. fieldhorizon.weather embeds each axis's positive and
# negative anchor statements and differences the means into an axis
# vector (mean(embed(positive)) - mean(embed(negative)), normalized). A
# fragment's reading on an axis is cosine(fragment_embedding, axis_vector).
# This has no bearing on retrieval, evaluation, or generation -- it only
# measures what the grown canon already is.
weather:
  hierarchy:
    positive:
      - "The lord commands and the servant obeys; between them there is no democracy."
      - "Order descends from above; it is not negotiated among equals."
      - "The throne is singular. Beneath it, every rank knows its place."
      - "Authority is not shared; it is delegated downward, never upward."
      - "The chain of command is a chain of being."
    negative:
      - "All voices carry equal weight; no throne stands above another."
      - "The committee decides by consensus, not by decree."
      - "Rank is a fiction; every station is interchangeable with every other."
      - "No one commands; the network merely routes requests."

  entropy:
    positive:
      - "The mountains crumble to dust and the stars fall like withered leaves."
      - "What was bound together is torn apart; the center does not hold."
      - "Every structure tends toward its own ruin."
      - "The archive rots; the record forgets itself."
      - "Form dissolves into noise, and noise into silence."
    negative:
      - "The word holds all things together in their proper place."
      - "What was scattered is gathered again into one body."
      - "The law binds what would otherwise fly apart."
      - "Every part answers to the whole, and the whole does not fray."

  sacrifice:
    positive:
      - "Nothing sacred was ever bought without blood."
      - "The altar demands what the self would rather keep."
      - "He gave his portion though none required it of him."
      - "The price of the covenant is paid in what is dearest."
      - "To keep nothing back is the only offering that counts."
    negative:
      - "Why surrender what comfort you may still enjoy?"
      - "The wise man keeps his portion and calls it prudence."
      - "No cause is worth more than the life spent pursuing it."
      - "Self-preservation is the first and only commandment."

  transcendence:
    positive:
      - "Beyond the system there is a truth the system cannot prove."
      - "The lord is not contained in the world he spoke into being."
      - "There is an outside to every closed account."
      - "What is highest cannot be reached by ascending what is merely given."
      - "The unconditioned does not answer to the conditions it exceeds."
    negative:
      - "There is nothing outside the system; the system is all there is."
      - "Every question finds its answer within the four walls of the given."
      - "The world explains itself without remainder."
      - "What cannot be measured does not exist."

  rationality:
    positive:
      - "Every claim must clear its audit before it is believed."
      - "The spreadsheet does not lie; the mystic might."
      - "Reason weighs all things on a single, legible scale."
      - "What cannot be justified by argument does not deserve assent."
      - "The procedure exists precisely so no one need trust revelation."
    negative:
      - "Some truths arrive unaudited, and are true regardless."
      - "The mystery does not answer to the ledger."
      - "Revelation does not wait for the committee's approval."
      - "What is holy was never meant to be legible to the clerk."

  violence_of_rhetoric:
    positive:
      - "Call the idol an idol; do not soften it into a 'perspective.'"
      - "The prophet does not negotiate with the false gods he denounces."
      - "Some words are meant to wound the comfortable."
      - "Judgment does not apologize for its own severity."
      - "The tongue that will not cut has already surrendered."
    negative:
      - "Every disagreement can be resolved with a kinder choice of words."
      - "The diplomat softens every accusation into a suggestion."
      - "There is no idol so false it cannot be discussed politely."
      - "Harsh language only closes the doors that patience would open."

  cooperation:
    positive:
      - "The body has many members, and none survives torn from the rest."
      - "What is carried together is carried further."
      - "The covenant binds neighbor to neighbor before it binds anyone to power."
      - "No one is saved alone; the caravan moves as one column."
      - "Burden shared is burden halved."
    negative:
      - "Every man competes for what only one can hold."
      - "The market rewards the one who out-bids his neighbor, not the one who helps him."
      - "Solidarity is a slogan; underneath it, each fends for himself."
      - "The strong do not wait for the weak to catch up."

  individualism:
    positive:
      - "The self answers to no council but its own conscience."
      - "One man's judgment, rightly formed, outweighs the crowd's."
      - "Choice belongs to the person, not to the tribe that surrounds him."
      - "Salvation is not distributed by committee; it is claimed by the one who seeks it."
      - "The soul stands alone before its reckoning."
    negative:
      - "The tribe decides what the member may not decide alone."
      - "There is no self outside the umma that forms it."
      - "The people move as one will, not as a thousand private ones."
      - "What the individual wants matters less than what the body requires."

