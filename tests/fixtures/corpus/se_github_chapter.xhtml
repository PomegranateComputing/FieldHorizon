		<section id="chapter-1" epub:type="chapter">
			<h2 epub:type="ordinal z3998:roman">I</h2>
			<p>I was returning home by the fields. It was midsummer, the hay harvest was over and they were just beginning to reap the rye.</p>
			<p>At that season of the year there is a delightful variety of flowers—red, white, and pink scented tufty clover; milk-white ox-eye daisies.</p>
